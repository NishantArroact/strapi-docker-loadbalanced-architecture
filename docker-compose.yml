services:
  strapi:
    build: .
    env_file:
      - .env
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi_pwd
      HOST: 0.0.0.0
      PORT: 1337
      URL: http://localhost
    expose:
      - "1337"
    depends_on:
      - db
    networks:
      - strapi_net

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi_pwd
    volumes:
      - strapi_db_data:/var/lib/postgresql/data
    networks:
      - strapi_net

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - strapi
    networks:
      - strapi_net

networks:
  strapi_net:

volumes:
  strapi_db_data:
